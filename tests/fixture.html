<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DSH 对话溯源助手 · 本地验证</title>
<style>
:root {--dsw-alias-bg-base:#f8faff;--dsw-alias-bg-layer-1:#fff;--dsw-alias-bg-layer-2:#f0f4fa;--dsw-alias-label-primary:#1a2b46;--dsw-alias-label-secondary:#5b6e89;--dsw-alias-border-l1:#e7edf5;--dsw-alias-border-l2:#d4dfed;--dsw-alias-state-success-primary:#128267;--dsw-alias-state-error-primary:#bd414e;--dsw-alias-state-warn-primary:#a86e16;--dsw-alias-brand-primary:#3575e8}
*{box-sizing:border-box}body{margin:0;background:#edf2f9;font:14px/1.7 -apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;color:#1a2b46}.fixture-toolbar{height:58px;padding:12px 24px;display:flex;gap:24px;align-items:center;background:#fff;border-bottom:1px solid #dde5ef}.fixture-toolbar button{border:1px solid #d4dfed;background:white;border-radius:9px;padding:6px 12px;color:#3575e8}.conversation{margin:24px 470px 24px 32px;background:#fff;border:1px solid #dde5ef;border-radius:16px;overflow:hidden}.conversation header{padding:18px 24px;border-bottom:1px solid #e7edf5;font-weight:600}.conversation header span{display:block;font-size:11px;font-weight:400;color:#75849b}.conversation section{height:440px;overflow:auto}.chat-flow{padding:24px}.message{margin:14px 0 24px;padding:16px 20px;border-radius:12px;background:#f7f9fd}.message small{color:#71829a}.message p{margin:9px 0}.spacer{height:280px;padding:30px;color:#96a3b6;font-size:12px}.conversation footer{padding:20px;border-top:1px solid #e7edf5;display:flex;gap:24px;align-items:center;color:#8a99b1}#test-results{max-height:120px;overflow:auto;margin:24px 470px 24px 32px;white-space:pre-wrap;font:11px/1.6 monospace;color:#5b6e89} .dsp-card{max-height:78vh!important;right:max(20px,calc(100vw - 1092px))!important}
@media(max-width:700px){.conversation{margin:12px}.conversation section{height:72vh}#test-results{max-height:120px;overflow:auto;margin:16px}.fixture-toolbar{font-size:11px;gap:8px}}
:root[data-fixture-theme="dark"] {--dsw-alias-bg-base:#16191f;--dsw-alias-bg-layer-1:#202329;--dsw-alias-bg-layer-2:#272c35;--dsw-alias-label-primary:#e4e9f2;--dsw-alias-label-secondary:#9aa8bd;--dsw-alias-border-l1:#303743;--dsw-alias-border-l2:#424d60}
body{background:var(--dsw-alias-bg-base);color:var(--dsw-alias-label-primary)}
.fixture-toolbar,.conversation{background:var(--dsw-alias-bg-layer-1);border-color:var(--dsw-alias-border-l2)}
.fixture-toolbar button{background:var(--dsw-alias-bg-layer-2);border-color:var(--dsw-alias-border-l2)}
.message{background:var(--dsw-alias-bg-base)}
.conversation header,.conversation footer{border-color:var(--dsw-alias-border-l1)}
.conversation footer{background:var(--dsw-alias-bg-layer-1)}
</style><div id="root"></div><script src="/fixture-bundle.js"></script></html>
